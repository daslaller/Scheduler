name: northline_schedule
description: Northline Device Repair bench scheduler — Flutter recreation of the Schedule Calendar UI mockup.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Instrument Serif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          style: italic
    - family: Work Sans
      fonts:
        - asset: assets/fonts/WorkSans-400.ttf
          weight: 400
        - asset: assets/fonts/WorkSans-500.ttf
          weight: 500
        - asset: assets/fonts/WorkSans-600.ttf
          weight: 600
        - asset: assets/fonts/WorkSans-700.ttf
          weight: 700
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
