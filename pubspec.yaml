name: rx_scheduler
description: Drop-in RepairX bench scheduler — clock in/out API, overlay toasts, and the Workbench calendar widget.
publish_to: "none"
version: 1.1.0+1

environment:
  # ⚠️ Match RepairX's floor, not the SDK this package happened to be authored
  # on. It pinned ^3.13.1 and nothing here needs it — the package depends on
  # `flutter` alone and uses no post-3.8 language feature. RepairX runs Dart
  # 3.12.2 (Flutter 3.44.9) and its Appwrite Sites build declares
  # `flutter-3.44`, so ^3.13.1 made `flutter pub get` fail outright for the
  # one consumer: "version solving failed ... Try using the Flutter SDK
  # version: 3.47.2". A constraint above the consumer's runtime is not a
  # safety margin, it is an outage.
  #
  # Raise it only alongside a language feature that actually needs it, and
  # move RepairX's `appwrite.json` buildRuntime and `pr-checks.yml` pin in the
  # same change.
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # ⚠️ No `fonts:` block, on purpose (owner, 2026-09-01). Flutter bundles every
  # font a dependency declares into the consuming app, with no opt-out, so the
  # four Inter faces this used to declare shipped into RepairX's web build as
  # `packages/rx_scheduler/Inter` — 1.30 MB of unsubsetted Inter beside the
  # app's own subsetted five, and nothing referenced them: `Wb.sans` is the
  # bare family name 'Inter', which inside a package resolves to the HOST
  # app's `Inter`, not to `packages/rx_scheduler/Inter`. Dead weight, at
  # nearly twice what RepairX's font subsetting (#412) had just saved.
  #
  # This is a drop-in for RepairX and RepairX supplies Inter. Standalone, the
  # demo in lib/main.dart renders in the platform default; the screenshot
  # harness is unaffected because it loads assets/fonts/ off disk through
  # `FontLoader` itself. Declare a family here again only if this package is
  # ever consumed by an app that does not ship Inter — and subset it first.
